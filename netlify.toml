# Static site: there is nothing to build — the files here are the website.
#
# The command is a real no-op rather than an empty string, and that distinction
# cost a failed production deploy. Netlify reads `command = ""` as NOT SET, not
# as "nothing to do", so it fell through to the build command still held in the
# site UI — "npm run build", left over from the Astro site that stood here —
# which exited 2 against a repo with no package.json.
#
# It looked fixed because `netlify deploy` from a laptop succeeded: the CLI
# resolves config locally and never consults the UI. Only a build on Netlify's
# own builders exercises that path, so only a git-triggered deploy could have
# caught it.
#
# A non-empty command wins over the UI outright, and it says so in the build log.
[build]
  command = "echo 'static site: nothing to build'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ============================================================================
# THE COMMONS THAT STOOD HERE
# ----------------------------------------------------------------------------
# amovera.net carried the Archiome Commons until October 2026. Those URLs are
# in the wild: indexed by search engines, printed in the kit, and linked from
# jackneoveris.com. Letting them 404 would be a silent deletion of work that
# still exists, so the readable half is redirected to an archive of the site as
# it stood at tag commons-1.0.
#
# 301, not 302: the move is permanent and search engines should carry the
# weight of the old URLs across rather than keep asking.
#
# No `force` on any of these. Without it a redirect yields to a real file at
# the same path, so if the vlog ever grows its own /about/ or /video/, that
# page wins and the rule quietly retires itself instead of shadowing it.
# ============================================================================

[[redirects]]
  from = "/manual/*"
  to = "https://archiome-commons-archive.netlify.app/manual/:splat"
  status = 301

[[redirects]]
  from = "/foundations/*"
  to = "https://archiome-commons-archive.netlify.app/foundations/:splat"
  status = 301

[[redirects]]
  from = "/kit/*"
  to = "https://archiome-commons-archive.netlify.app/kit/:splat"
  status = 301

[[redirects]]
  from = "/deck/*"
  to = "https://archiome-commons-archive.netlify.app/deck/:splat"
  status = 301

[[redirects]]
  from = "/start/*"
  to = "https://archiome-commons-archive.netlify.app/start/:splat"
  status = 301

[[redirects]]
  from = "/metasymbology/*"
  to = "https://archiome-commons-archive.netlify.app/metasymbology/:splat"
  status = 301

[[redirects]]
  from = "/apps/*"
  to = "https://archiome-commons-archive.netlify.app/apps/:splat"
  status = 301

[[redirects]]
  from = "/posters/*"
  to = "https://archiome-commons-archive.netlify.app/posters/:splat"
  status = 301

[[redirects]]
  from = "/video/*"
  to = "https://archiome-commons-archive.netlify.app/video/:splat"
  status = 301

# /about/ is the one name both sites want. The vlog says who is speaking on its
# own page, so the old essay keeps the path rather than competing for it.
[[redirects]]
  from = "/about/*"
  to = "https://archiome-commons-archive.netlify.app/about/:splat"
  status = 301

# DELIBERATELY NOT REDIRECTED: /submit/, /vote/, /chatroom/, /account/, /login.
# Those are the write surfaces, and they were retired rather than moved. A
# redirect would carry someone to a submission form that cannot admit anything
# and a room nobody is in. They 404 here, which is the honest answer.
#
# Also not redirected: /sitemap.xml and /robots.txt, which this site owns.
